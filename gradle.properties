# v2 F0: Gemma 모델을 APK 번들에서 on-demand 다운로드로 전환하면서 기본 heap 으로 원복.
# Chaquopy + MediaPipe 동시 KSP/AGP 컴파일 여유를 위해 4GB 유지.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Windows 경로에 한글("미래내일")이 포함되어 있어도 AGP 경고만 끄고 진행.
# 실제 빌드 시 AAPT/KSP 등이 실패하면 프로젝트를 ASCII 경로(예: C:\work\HacdCode)로 복사 후 재빌드 필요.
android.overridePathCheck=true
# Phase 2B Task 1: 시스템 CMake(cmake.dir) 사용 시 Ninja 를 PATH 에서 찾아야 함.
# VS 2022 번들 Ninja 경로를 Gradle JVM 프로세스에 주입.
# org.gradle.jvmargs 는 PATH 를 변경하지 않으므로 별도 설정.
# → local.properties cmake.dir + PATH 에 ninja.exe 위치가 포함되어야 NDK CMake 빌드 가능.
